services:
  dashboard:
    build: .
    container_name: error-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    # If Elasticsearch uses a company CA certificate, put it next to this file,
    # uncomment the line below and set ES_CA_CERT=/app/certs/ca.crt in .env
    # volumes:
    #   - ./ca.crt:/app/certs/ca.crt:ro
